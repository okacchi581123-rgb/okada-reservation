<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>オカダスポーツ予約</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#edf1f5;color:#071f3d}
    main{min-height:100vh;display:grid;place-items:center;padding:24px}
    .panel{width:min(360px,92vw);background:#fff;border:1px solid #d4e2ec;border-radius:18px;padding:28px 22px;text-align:center;box-shadow:0 12px 32px rgba(7,31,61,.12)}
    .spinner{width:48px;height:48px;margin:0 auto 18px;border:5px solid #d4e2ec;border-top-color:#071f3d;border-right-color:#ffd400;border-radius:50%;animation:spin .8s linear infinite}
    h1{margin:0 0 8px;font-size:20px}
    p{margin:0;color:#637487;line-height:1.6;font-size:14px}
    .error{margin-top:14px;color:#b42318;font-weight:700}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<main>
  <section class="panel">
    <div class="spinner" aria-hidden="true"></div>
    <h1>予約画面を開いています</h1>
    <p id="status">LINE登録情報を確認しています。</p>
    <p id="error" class="error"></p>
  </section>
</main>

<form id="bridgeForm" method="post"
  action="https://script.google.com/macros/s/AKfycbxMBNdSLimZNbXfcforx7Q5q5qk5MXVNGMwTGREHnQx8w95lhQCrfG-Od7h62jv-avKPg/exec"
  style="display:none">
  <input id="idTokenInput" type="hidden" name="idToken" value="">
</form>

<script>
const LIFF_ID = "2011019665-wbKBw2hK";

function showError(message) {
  document.getElementById("status").textContent = "予約画面を開けませんでした。";
  document.getElementById("error").textContent =
    message || "LINEからもう一度開いてください。";
}

async function start() {
  try {
    if (!window.liff) {
      showError("LINE認証の読み込みに失敗しました。");
      return;
    }

    await liff.init({ liffId: LIFF_ID });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const idToken = liff.getIDToken();

    if (!idToken) {
      showError("LINE認証情報を取得できませんでした。");
      return;
    }

    document.getElementById("idTokenInput").value = idToken;
    document.getElementById("status").textContent = "登録情報を確認しています。";
    document.getElementById("bridgeForm").submit();
  } catch (error) {
    console.error("LIFF起動エラー", error);
    showError("LINE認証に失敗しました。LINEからもう一度開いてください。");
  }
}

start();
</script>
</body>
</html>
