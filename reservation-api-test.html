   /* 工程9：5営業日表示・横スクロール廃止 */
.grid-wrap {
  position: relative;
  width: 100%;
  max-width: 100%;
  max-height: none;
min-height: 0;
overflow-x: clip;
overflow-y: visible;
overscroll-behavior: auto;
-webkit-overflow-scrolling: auto;
  isolation: isolate;
}

.availability {
  width: 100% !important;
  min-width: 0 !important;
  table-layout: fixed;
  border-collapse: separate;
  border-spacing: 0;
}

.availability th,
.availability td {
  min-width: 0 !important;
  max-width: none !important;
  width: auto;
  height: 52px;
  padding: 6px 1px;
  box-sizing: border-box;
  overflow: hidden;
}

.availability thead th {
  position: sticky;
  top: 0;
  z-index: 20;
  background: #071f3d;
  box-shadow: inset 0 -4px #ffd400;
  backface-visibility: hidden;
  font-size: 12px;
  line-height: 1.25;
}

.availability .time {
  position: sticky;
  left: 0;
  z-index: 18;
  width: 58px !important;
  min-width: 58px !important;
  max-width: 58px !important;
  background: #f3f5f7;
  backface-visibility: hidden;
  font-size: 13px;
}

.availability thead .time {
  top: 0;
  left: 0;
  z-index: 22;
  background: #071f3d;
}

.availability button {
  min-width: 40px;
  min-height: 40px;
  padding: 2px !important;
}


html.ios-device .birth-selects select {
  min-height: 56px;
  padding: 8px 28px 8px 8px;
  font-size: 20px !important;
  text-align: center;
}
.menu-choice {
  grid-template-columns: max-content max-content minmax(0, 1fr) !important;
  column-gap: 6px;
  align-items: center;
}

.menu-choice .menu-main {
  grid-column: 1 !important;
  min-width: 0;
  white-space: nowrap;
  font-size: clamp(12px, 3.1vw, 15px);
}

.menu-choice .menu-detail {
  grid-column: 2 !important;
  white-space: nowrap;
  font-size: clamp(11px, 2.9vw, 14px);
}

.menu-choice .menu-status {
  grid-column: 3 !important;
  justify-self: end;
  white-space: nowrap;
  font-size: clamp(11px, 2.9vw, 14px);
  border-left: 2px solid var(--border);
  padding-left: 8px;
}

.menu-choice .menu-desc,
.menu-choice .menu-price {
  grid-column: 1 / -1 !important;
}
/* 工程9：共通ローディング画面 */
.loading-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: grid;
  place-items: center;
  padding: 24px;
  background: rgba(7, 31, 61, 0.68);
  backdrop-filter: blur(3px);
}

.loading-panel {
  width: min(360px, 90vw);
  padding: 26px 20px;
  text-align: center;
  background: #fff;
  border: 2px solid #071f3d;
  border-radius: 18px;
  box-shadow: 0 18px 45px rgba(7, 31, 61, 0.3);
}

.loading-spinner {
  width: 48px;
  height: 48px;
  margin: 0 auto 16px;
  border: 5px solid #d4e2ec;
  border-top-color: #071f3d;
  border-right-color: #ffd400;
  border-radius: 50%;
  animation: loading-spin 0.8s linear infinite;
}

.loading-title {
  color: #071f3d;
  font-size: 17px;
  font-weight: 900;
}

.loading-detail {
  min-height: 1.5em;
  margin-top: 8px;
  color: #637487;
  font-size: 13px;
  line-height: 1.5;
}

@keyframes loading-spin {
  to {
    transform: rotate(360deg);
  }
}

/* v137：空き状況取得時は画面全体へ薄いグレーのフィルターを表示 */
.loading-overlay.availability-loading-mode {
  background: rgba(225, 230, 235, 0.78);
  backdrop-filter: blur(2px);
}

.loading-overlay.availability-loading-mode .loading-panel {
  width: min(330px, 86vw);
  padding: 23px 18px;
}

.loading-overlay.availability-loading-mode .loading-spinner {
  width: 42px;
  height: 42px;
  margin-bottom: 13px;
}
/* v138：予約管理ボタンを受診者カード直下の通常配置へ変更 */
.reservation-fixed-bar{
  position:static;
  /* v141：メニュー項目と左右の基準線を統一 */
  margin:-4px 12px 12px;
  padding:0;
  background:transparent;
  border:0;
  box-shadow:none;
}

.reservation-fixed-bar button{
  width:100%;
  min-height:52px;
  border:2px solid #cbdde9;
  border-radius:14px;
  background:#edf7fd;
  color:#071f3d;
  font-size:15px;
  font-weight:800;
  letter-spacing:.03em;
  box-shadow:none;
}
.reservation-compact-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) 64px;
  gap: 10px;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid #dbe5ee;
}

.reservation-compact-date {
  white-space: nowrap;
  font-weight: 800;
  color: #071f3d;
}

.reservation-compact-menu {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: #071f3d;
}

.reservation-change-button {
  width: 64px;
  min-height: 44px;
  margin: 0;
  padding: 8px;
  border: 0;
  border-radius: 10px;
  background: #071f3d;
  color: #fff;
  font-weight: 800;
  font-size: 15px;
}

.reservation-action-overlay {
  position: fixed;
  inset: 0;
  z-index: 3000;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 16px;
  background: rgba(0, 0, 0, 0.55);
}

.reservation-action-sheet {
  width: min(520px, 100%);
  padding: 22px 18px
    calc(22px + env(safe-area-inset-bottom));
  border-radius: 22px;
  background: #fff;
  box-shadow: 0 -10px 30px
    rgba(7, 31, 61, 0.2);
}

.reservation-action-sheet h3 {
  margin: 0 0 16px;
  text-align: center;
  color: #071f3d;
}

.reservation-action-sheet button {
  width: 100%;
}
/* 予約日時表：日付行を上部へ固定 */
.grid-wrap {
  overflow: visible !important;
  isolation: auto;
}

.availability thead th {
  position: sticky;
  top: calc(
    58px + env(safe-area-inset-top)
  );
  z-index: 60;
}

.availability thead .time {
  position: sticky;
  top: calc(
    58px + env(safe-area-inset-top)

if(/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)){document.documentElement.classList.add('ios-device')}
const registrationTestMode=new URLSearchParams(location.search).get("registrationTest")==="1";
const state={registrantId:registrationTestMode?"":(initialRegistrantId||(localStorage.getItem("okadaRegistrantId")||"")),lineUserId:registrationTestMode?"":(initialLineUserId||""),visitorId:"",date:"",menu:"",menuMinutes:30,menuMeta:{},slot:null,lockId:"",processing:false,dates:[],week:0,gridResults:{},prefetching:{},expiresAt:0,countdownTimer:null,

  function gas(name,args,onSuccess,onFailure){
    const controller=new AbortController();
    const timeoutId=setTimeout(function(){controller.abort()},20000);

    fetch(GAS_API_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({
        apiVersion:"1",
        action:name,
        args:Array.isArray(args)?args:[],
        idToken:apiIdToken
      }),
      redirect:"follow",
      signal:controller.signal
    })
      .then(function(response){
        if(!response.ok)throw new Error("HTTP "+response.status);
        return response.json();
      })
      .then(function(envelope){
        if(!envelope||envelope.success!==true){
          throw new Error(envelope&&envelope.message?envelope.message:"通信に失敗しました");
        }
        if(typeof onSuccess==="function")onSuccess(envelope.data);
      })
      .catch(function(error){
        if(error&&error.name==="AbortError"){
          error=new Error("通信が20秒を超えたため中断しました");
        }
        (onFailure||showFatal)(error);
      })
      .finally(function(){
        clearTimeout(timeoutId);
      });
  }
  function showFatal(e){alert("処理に失敗しました。時間をおいて再度お試しください。");console.error(e)}
  function setMessage(id,text,error){$(id).innerHTML=text?'<div class="message '+(error?'error':'')+'">'+text+'</div>':''}

  if (!announcement) return;

  gas(

    [],
    function(result) {
      const text = String(
        result && result.success
          ? result.announcement || ""
          : ""
      ).trim();

      announcement.textContent = text;
      announcement.classList.toggle("hidden", !text);
    },
    function(error) {
      announcement.textContent = "";
      announcement.classList.add("hidden");

        "予約画面のお知らせを取得できませんでした。",

  pendingInitialCancellationReservationId =

  $("initialCancellationMessage").textContent =

  )

    affected.length

          return (

      : "対象となる再診予約があります。";

  $("initialCancellationOverlay")

}

function closeInitialCancellationWarning() {
  pendingInitialCancellationReservationId = "";

  $("initialCancellationOverlay")
    .classList.add("hidden");
}

function continueInitialAndRevisitCancellation() {
  const reservationId =
    pendingInitialCancellationReservationId;

  closeInitialCancellationWarning();

  if (reservationId) {
    cancelCurrentReservation(

  let loadingShowTimer = null;
let loadingLongTimer = null;
let activeLoadingId = 0;

function startLoading(title, showImmediately, loadingMode) {
  const loadingId = ++activeLoadingId;

  clearTimeout(loadingShowTimer);
  clearTimeout(loadingLongTimer);

  $("loadingTitle").textContent =
    title || "処理しています";

  $("loadingDetail").textContent = "";
  $("loadingOverlay").classList.toggle(
    "availability-loading-mode",
    loadingMode === "availability"
  );
  $("loadingOverlay").classList.toggle(
    "hidden",
    !showImmediately
  );

  if (!showImmediately) {
    loadingShowTimer = setTimeout(function() {
      if (loadingId !== activeLoadingId) return;

      $("loadingOverlay").classList.remove("hidden");
    }, 400);
  }

  loadingLongTimer = setTimeout(function() {
    if (loadingId !== activeLoadingId) return;

    $("loadingDetail").textContent =
      "処理に少し時間がかかっています。そのままお待ちください。";
  }, 3000);

  return loadingId;
}

function stopLoading(loadingId) {
  if (loadingId !== activeLoadingId) return;

  clearTimeout(loadingShowTimer);
  clearTimeout(loadingLongTimer);

  $("loadingOverlay").classList.add("hidden");
  $("loadingOverlay").classList.remove(
    "availability-loading-mode"
  );

}

    .split("/");

      " " +

    Number(parts[1]) - 1,
    Number(parts[2])

  ];

  return (
    Number(parts[1]) + "/" +
    Number(parts[2]) +
    "（" + weekdays[date.getDay()] + "） " +
    String(timeText || "")
  );

  $("slotCard")
    .classList.remove("hidden");

  if (state.slot) {
    showBookingFooter(
      state.date,
      state.slot.start,
      state.slot.end
    );

    $("footerReserveBtn").disabled =
      false;
  }

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}
function cancelReservationChange() {
  if (state.processing) {
    return;
  }

  clearReservationInputs(true);
  showReservations();
}
function showReservations() {
  hideBookingFooter();
  $("reservationFixedBar").classList.add("hidden");

  $("visitorCard").classList.add("hidden");
  $("menuCard").classList.add("hidden");
  $("slotCard").classList.add("hidden");
  $("noteCard").classList.add("hidden");
  $("confirmCard").classList.add("hidden");
  $("completeCard").classList.add("hidden");

  /* v134：最新予約の取得前は古い一覧を表示しない */
  $("reservationsCard").classList.add("hidden");
  $("reservationList").innerHTML = "";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
  const loadingId = startLoading(
    "現在の予約を確認しています"
  );
  gas(    "getStage6CurrentReservations",
[
  state.registrantId,
  state.visitorId
],
function(list) {
  stopLoading(loadingId);
  state.currentReservations = Array.isArray(list) ? list : [];

  const box = $("reservationList");
      if (!list || !list.length) {
        box.innerHTML = "<p>現在の予約はありません</p>";
      } else {
box.innerHTML = list.map(function(r) {
  const shortDate =
    String(r.date || "")
      .replace(/^\d{4}\//, "");

  const safeReservationId =
    String(r.reservationId || "")
      .replace(/'/g, "\\'");

  return (
    '<div class="reservation-compact-row">' +
      '<span class="reservation-compact-date">' +
        escapeHtml(
          shortDate + " " + r.start
        ) +
      '</span>' +
      '<span class="reservation-compact-menu">' +
        escapeHtml(r.menu) +
      '</span>' +
      '<button type="button" ' +
        'class="reservation-change-button" ' +
        'onclick="openReservationActions(\'' +
          safeReservationId +
        '\')">' +
        '変更' +
      '</button>' +
    '</div>'
  );
}).join("");
      }

      $("reservationsCard").classList.remove("hidden");
      $("reservationsCard").scrollIntoView({
        behavior: "smooth"
      });
    }
  );
  }
  let selectedReservationActionId = "";

function openReservationActions(
  reservationId
) {
  if (state.processing) {
    return;
  }

  const reservation =
    (state.currentReservations || [])
      .find(function(item) {
        return (
          String(item.reservationId) ===
          String(reservationId)
        );
      });

  if (!reservation) {
    alert(
      "予約内容を確認できませんでした"
    );
    return;
  }

  selectedReservationActionId =
    String(reservationId);

  $("reservationDateChangeBtn").onclick =
    function() {
      const targetId =
        selectedReservationActionId;

      closeReservationActions();
      startReservationChange(targetId);
    };

const cancelButton =
  $("reservationCancelBtn");

$("reservationDateChangeBtn")
  .classList.remove("hidden");

$("reservationCancelConfirmDetails")
  .classList.add("hidden");

$("reservationCancelTarget").textContent = "";

cancelButton.textContent =
  "予約をキャンセル";

cancelButton.dataset.confirming = "0";
cancelButton.classList.remove("danger");

cancelButton.onclick = function() {
  if (
    cancelButton.dataset.confirming !==
    "1"
  ) {
    cancelButton.dataset.confirming = "1";

    cancelButton.textContent =
      "キャンセルする";

    cancelButton.classList.add("danger");

    $("reservationDateChangeBtn")
      .classList.add("hidden");

    $("reservationCancelTarget").textContent =
      formatReservationDateTimeWithWeekday(
        reservation.date,
        reservation.start
      ) +
      "／" +
      String(reservation.menu || "予約");

    $("reservationCancelConfirmDetails")
      .classList.remove("hidden");

    return;
  }

  const targetId =
    selectedReservationActionId;

  closeReservationActions();
  cancelCurrentReservation(targetId);
};
  $("reservationActionOverlay")
    .classList.remove("hidden");

  document.body.style.overflow = "hidden";

  setTimeout(function() {
    $("reservationDateChangeBtn").focus();
  }, 0);
}

function closeReservationActions() {
  if (state.processing) {
    return;
  }

  $("reservationActionOverlay")
    .classList.add("hidden");

  $("reservationDateChangeBtn")
    .classList.remove("hidden");

  $("reservationCancelConfirmDetails")
    .classList.add("hidden");

  $("reservationCancelBtn")
    .classList.remove("danger");

  selectedReservationActionId = "";
  document.body.style.overflow = "";
}
function cancelCurrentReservation(
  reservationId,
  confirmDependentRevisits
) {
  if (state.processing) {
    return;
  }


  state.processing = true;

  const loadingId = startLoading(
    "予約をキャンセルしています"
  );

  gas(
    "cancelStage6Reservation",
    [
      state.registrantId,
      reservationId,
      confirmDependentRevisits === true
    ],
    function(result) {
      if (
        !result ||
        !result.success
      ) {
        state.processing = false;
        stopLoading(loadingId);

        if (
          result &&
          result.requiresDependentCancellationConfirmation
        ) {
          showInitialCancellationWarning(
            reservationId,
            result
          );
          return;
        }

        alert(
          result && result.message
            ? result.message
            : "キャンセルに失敗しました"
        );
        return;
      }

      gas(
        "rebuildStage9Snapshot",
        [
          "WEB予約キャンセル後再構築"
        ],
        function(rebuildResult) {
          state.processing = false;
          stopLoading(loadingId);
          invalidateAvailabilityCache();

          showCancellationCompletion(
            result,
            false
          );

        },
        function(rebuildError) {
          state.processing = false;
          stopLoading(loadingId);
          invalidateAvailabilityCache();

          console.error(
            "キャンセル後の空き枠再構築に失敗",
            rebuildError
          );

          showCancellationCompletion(
            result,
            true
          );

        }
      );
    },
    function(error) {
      state.processing = false;
      stopLoading(loadingId);

      console.error(error);

      alert(
        "キャンセル処理に失敗しました"
      );
    }
  );
}
function showCancellationCompletion(
  result,
  snapshotFailed
) {
  const cancelled = Array.isArray(
    result && result.cancelledReservations
  )
    ? result.cancelledReservations
    : [];

  let completionRows = "";

  cancelled.forEach(function(item, index) {
    completionRows += row(
      String(
        item.menuName ||
        (
          cancelled.length > 1
            ? "キャンセル" + String(index + 1)
            : "キャンセルした予約"
        )
      ),
      formatReservationDateTimeWithWeekday(
        item.date,
        item.startTime
      )
    );
  });

  if (!completionRows) {
    completionRows = row(
      "予約ID",
      String(
        result && result.reservationId
          ? result.reservationId
          : ""
      )
    );
  }

  $("reservationsCard").classList.add("hidden");
  $("reservationActionOverlay").classList.add("hidden");
  $("reservationFixedBar").classList.add("hidden");
  $("brandHeader").classList.remove("hidden");
  $("topActions").classList.remove("hidden");

  const completeTitle =
    $("completeCard").querySelector("h2");

  if (completeTitle) {
    completeTitle.textContent =
      "キャンセルが完了しました";
  }

  $("completeDetails").innerHTML =
    "<p>以下の予約をキャンセルしました。</p>" +
    completionRows +
    (
      snapshotFailed
        ? '<div class="message error">空き枠情報の更新に失敗しました。予約のキャンセルは完了しています。</div>'
        : ""
    );

  $("completeCard").classList.remove("hidden");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}
function closeReservations() {
  if (state.processing) {
    return;
  }

  /* v128：キャンセル・予約変更後の古いメニュー表示を残さない */
  state.menu = "";
  state.menuMeta = {};
  state.slot = null;
  state.week = 0;
  state.gridResults = {};
  state.prefetching = {};
  $("menu").value = "";
  $("menuOptions").innerHTML = "";
  hideBookingFooter();

  $("reservationsCard")
    .classList.add("hidden");

  $("visitorCard")
    .classList.remove("hidden");

  $("menuCard")
    .classList.remove("hidden");

  $("slotCard")
    .classList.add("hidden");

  $("noteCard")
    .classList.add("hidden");

  $("confirmCard")
    .classList.add("hidden");

  $("completeCard")
    .classList.add("hidden");

  $("brandHeader")
    .classList.remove("hidden");

  $("topActions")
    .classList.remove("hidden");

  $("reservationFixedBar")
    .classList.remove("hidden");

  if (state.visitorId) {
    loadMenus();
  } else {
    loadVisitors();
  }

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}
function initializeApiBooking(){
  liff.init({liffId:LIFF_ID})
    .then(function(){
      if(!liff.isLoggedIn()){
        liff.login();
        return;
      }

      apiIdToken=liff.getIDToken()||"";
      if(!apiIdToken){
        lineAuthError="ID_TOKEN_REQUIRED";
        state.registrantId="";
        boot();
        return;
      }

      gas(
        "authenticate",
        [],
        function(result){
          state.lineUserId="LINE_AUTHENTICATED";
          state.registrantId=result&&result.found
            ? String(result.registrantId||"")
            : "";

          if(state.registrantId){
            localStorage.setItem("okadaRegistrantId",state.registrantId);
          }else{
            localStorage.removeItem("okadaRegistrantId");
          }

          boot();
        },
        function(error){
          console.error(error);
          lineAuthError="LINE_AUTH_FAILED";
          state.registrantId="";
          localStorage.removeItem("okadaRegistrantId");
          boot();
        }
      );
    })
    .catch(function(error){
      console.error(error);
      lineAuthError="LIFF_INIT_FAILED";
      state.registrantId="";
      boot();
    });
}

$("note").addEventListener("input",e=>$("noteCount").textContent=e.target.value.length);
initializeApiBooking();
</script>
