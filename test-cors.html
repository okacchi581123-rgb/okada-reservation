<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>予約システム通信テスト</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; color: #082747; background: #f2f6f9; }
    main { max-width: 560px; margin: 0 auto; }
    .card { padding: 22px 18px; border: 2px solid #d7e4ec; border-radius: 18px; background: #fff; }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { margin: 0 0 18px; line-height: 1.65; }
    button { width: 100%; min-height: 54px; border: 0; border-radius: 13px; color: #fff; background: #082747; font-size: 17px; font-weight: 700; }
    button:disabled { color: #687785; background: #dce4e9; }
    .result { margin-top: 18px; padding: 15px; border-radius: 12px; background: #eef5f9; white-space: pre-wrap; line-height: 1.6; }
    .success { color: #086c37; background: #eaf8f0; }
    .failure { color: #a22121; background: #fff0f0; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>通信・LINE認証テスト</h1>
      <p>本番予約には影響しません。通信確認後、LINE認証を確認します。</p>
      <button id="runButton" type="button" disabled>LIFF初期化中…</button>
      <div id="result" class="result" role="status" aria-live="polite">準備しています。</div>
    </section>
  </main>

  <script>
    'use strict';

    const LIFF_ID = '2011019665-wbKBw2hK';
    // 新規のテスト用GASをデプロイ後、その /exec URLへ置き換える。
    const TEST_GAS_URL = 'https://script.google.com/macros/s/AKfycbyHfujvY6Al8a0Z2ANMYiNZvxqxqI5I76PKOYMhnCBXbB6suONd2x_Mk8slZWi3wxlH/exec';
    const TIMEOUT_MS = 15000;

    const runButton = document.getElementById('runButton');
    const resultArea = document.getElementById('result');

    function showResult(message, state) {
      resultArea.textContent = message;
      resultArea.className = 'result' + (state ? ' ' + state : '');
    }

    async function postToTestApi(payload) {
      if (!TEST_GAS_URL.startsWith('https://script.google.com/macros/s/') ||
          !TEST_GAS_URL.endsWith('/exec')) {
        throw new Error('テスト用GAS URLが未設定です。');
      }

      const controller = new AbortController();
      const timer = setTimeout(function () { controller.abort(); }, TIMEOUT_MS);
      try {
        const response = await fetch(TEST_GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          credentials: 'omit',
          redirect: 'follow',
          signal: controller.signal
        });

        const body = await response.text();
        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }
        try {
          return JSON.parse(body);
        } catch (_) {
          throw new Error('GASの応答をJSONとして読み取れませんでした。');
        }
      } catch (error) {
        if (error.name === 'AbortError') {
          throw new Error('15秒以内に応答がありませんでした。');
        }
        throw error;
      } finally {
        clearTimeout(timer);
      }
    }

    async function runPoc() {
      runButton.disabled = true;
      showResult('1/2　GASとの通信を確認しています…');

      try {
        const corsResult = await postToTestApi({
          action: 'corsEcho',
          nonce: String(Date.now())
        });
        if (!corsResult.success || corsResult.test !== 'cors-echo') {
          throw new Error('CORS通信テストが正常終了しませんでした。');
        }

        showResult('2/2　LINE認証を確認しています…');
        const idToken = liff.getIDToken();
        if (!idToken) {
          throw new Error('LINE IDトークンを取得できませんでした。');
        }

        const authResult = await postToTestApi({
          action: 'verifyLineAuth',
          idToken: idToken
        });
        if (!authResult.success || !authResult.authenticated) {
          throw new Error('LINE認証テストが正常終了しませんでした。');
        }

        showResult(
          'テスト成功\n\n' +
          '・GitHub Pages → GAS通信：成功\n' +
          '・LINE IDトークン検証：成功\n' +
          '・確認番号：' + authResult.userFingerprint,
          'success'
        );
      } catch (error) {
        showResult(
          'テスト失敗\n\n' + error.message +
          '\n\n画面を閉じず、この表示のスクリーンショットを保存してください。',
          'failure'
        );
      } finally {
        runButton.disabled = false;
        runButton.textContent = 'もう一度テストする';
      }
    }

    liff.init({ liffId: LIFF_ID })
      .then(function () {
        if (!liff.isLoggedIn()) {
          showResult('LINEログイン画面へ移動します。');
          liff.login({ redirectUri: window.location.href.split('#')[0] });
          return;
        }
        showResult('準備ができました。「テストを開始」を押してください。');
        runButton.disabled = false;
        runButton.textContent = 'テストを開始';
        runButton.addEventListener('click', runPoc);
      })
      .catch(function (error) {
        showResult('LIFF初期化に失敗しました。\n\n' + error.message, 'failure');
      });
  </script>
</body>
</html>
